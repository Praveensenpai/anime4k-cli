name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: anime4k
            asset_name: anime4k-linux-x86_64.tar.gz
            use_cross: false

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: anime4k
            asset_name: anime4k-linux-aarch64.tar.gz
            use_cross: true

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: anime4k
            asset_name: anime4k-darwin-arm64.tar.gz
            use_cross: false

          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: anime4k
            asset_name: anime4k-darwin-x86_64.tar.gz
            use_cross: false

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: anime4k.exe
            asset_name: anime4k-windows-x86_64.zip
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary
        if: "!matrix.use_cross"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build binary with cross
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Package asset (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.asset_name }} ${{ matrix.artifact_name }}

      - name: Package asset (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path ${{ matrix.artifact_name }} -DestinationPath ../../../${{ matrix.asset_name }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
